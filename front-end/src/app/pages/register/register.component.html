<div class="container">
  <div class="row justify-content-center align-items-center min-vh-100">
    <div class="col-12 col-sm-9 col-md-6 col-lg-5">
      <div class="card shadow border-0">
        <div class="card-body p-4">

          <h3 class="text-center mb-2">Create Account</h3>

          <p class="text-center text-muted mb-4">
            สมัครสมาชิกเพื่อเข้าใช้งานระบบ
          </p>

          <div *ngIf="errorMessage"
               class="alert alert-danger">
            {{ errorMessage }}
          </div>

          <div *ngIf="successMessage"
               class="alert alert-success">
            {{ successMessage }}
          </div>

          <form #registerForm="ngForm"
                novalidate
                (ngSubmit)="onRegister()">

            <div class="mb-3 row align-items-center">
              <label class="form-label col-sm-4 mb-sm-0 text-end">Username</label>
              <div class="col-sm-8">
                <input
                  type="text"
                  name="name"
                  class="form-control"
                  [(ngModel)]="name"
                  autocomplete="name"
                  minlength="3"
                  required>
              </div>
            </div>

 

            <div class="mb-3 row align-items-center">
              <label class="form-label col-sm-4 mb-sm-0 text-end">Password</label>
              <div class="col-sm-8">
                <input
                  type="password"
                  name="password"
                  class="form-control"
                  [(ngModel)]="password"
                  autocomplete="new-password"
                  minlength="8"
                  required>
                <small class="text-muted">
                  ต้องมีอย่างน้อย 8 ตัวอักษร
                </small>
              </div>
            </div>

            <div class="mb-3 row align-items-center">
              <label class="form-label col-sm-4 mb-sm-0 text-end">Confirm Password</label>
              <div class="col-sm-8">
                <input
                  type="password"
                  name="confirmPassword"
                  class="form-control"
                  [(ngModel)]="confirmPassword"
                  autocomplete="new-password"
                  required>
              </div>
            </div>
            <div class="mb-3 row align-items-center">
              <label class="form-label col-sm-4 mb-sm-0 text-end"></label>
              <div class="col-sm-8">
                  <button
                  type="submit"
                  class="btn btn-primary w-100"
                  [disabled]="loading">
                  {{ loading ? 'กำลังสมัครสมาชิก...' : 'สมัครสมาชิก' }}
                </button>
              </div>
            </div>

          

          </form>

          <div class="text-center mt-4">
            มีบัญชีอยู่แล้ว?
            <a routerLink="/login"
               class="text-decoration-none">
              Login
            </a>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>
